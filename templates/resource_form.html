{% extends 'base.html' %}{% block content %}<div class="page-heading"><div class="eyebrow">QUẢN LÝ NGUỒN LỰC</div><h1>{{ title }}</h1><p class="page-subtitle">Bổ sung nhân sự, công nhật, thiết bị hoặc phương tiện vận chuyển.</p></div>
<form method="post" class="panel standalone-form"><div class="form-grid two-col"><div class="field full"><label>Tên nguồn lực <em>*</em></label><input name="name" required value="{{ item.name if item else '' }}" placeholder="Tên vị trí / thiết bị"></div><div class="field"><label>Loại nguồn lực</label><select name="resource_type">{% for x in ['Ban chỉ huy','Công nhật','Thiết bị / vận chuyển','Nhân sự','Vật tư','Khác'] %}<option {% if item and item.resource_type==x %}selected{% elif not item and x=='Nhân sự' %}selected{% endif %}>{{ x }}</option>{% endfor %}</select></div><div class="field"><label>Nhóm</label><input name="group_name" value="{{ item.group_name if item else '' }}" placeholder="Ví dụ: HSSE / Hạ tầng"></div><div class="field"><label>Số lượng</label><input type="number" step="1" min="0" name="quantity" value="{{ (item.quantity or 0)|round|int if item else 1 }}"></div><div class="field"><label>Đơn vị</label><input name="unit" value="{{ item.unit if item else 'người' }}"></div><div class="field"><label>Thời gian (tháng)</label><input type="number" step="1" min="0" name="duration_months" value="{{ (item.duration_months or 0)|round|int if item else 0 }}"></div><div class="field"><label>Chi phí tham chiếu (VND)</label><input type="number" step="1000" min="0" name="cost" value="{{ item.cost if item else 0 }}"></div><div class="field"><label>Ngày bắt đầu</label><input type="date" name="start_date" value="{{ item.start_date if item and item.start_date else '' }}"></div><div class="field"><label>Ngày kết thúc</label><input type="date" name="end_date" value="{{ item.end_date if item and item.end_date else '' }}"></div><div class="field full"><label>Ghi chú</label><textarea name="notes" rows="3">{{ item.notes if item else '' }}</textarea></div></div><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('resources_list') }}">Hủy</a><button class="btn btn-primary">✓ &nbsp; Lưu nguồn lực</button></div></form>{% endblock %}
