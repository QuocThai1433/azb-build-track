{% extends 'base.html' %}{% block content %}<div class="page-heading"><div class="eyebrow">BIỆN PHÁP THI CÔNG</div><h1>{{ title }}</h1><p class="page-subtitle">Quản lý phạm vi hạng mục, khối lượng và diễn giải.</p></div><form method="post" class="panel standalone-form"><div class="form-grid two-col"><div class="field full"><label>Tên hạng mục <em>*</em></label><input required name="name" value="{{ item.name if item else '' }}"></div><div class="field"><label>Đơn vị tính</label><input name="unit" value="{{ item.unit if item else '' }}"></div><div class="field"><label>Khối lượng</label><input type="number" step="0.01" min="0" name="quantity" value="{{ item.quantity if item else 0 }}"></div><div class="field full"><label>Quy cách / diễn giải</label><textarea name="specification" rows="3">{{ item.specification if item else '' }}</textarea></div><div class="field"><label>Thời gian theo tiến độ</label><input name="schedule" value="{{ item.schedule if item else '' }}"></div><div class="field"><label>Nguồn tham chiếu</label><input name="source" value="{{ item.source if item else '' }}"></div></div><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('methods_list') }}">Hủy</a><button class="btn btn-primary">✓ &nbsp; Lưu hạng mục</button></div></form>{% endblock %}
