{% extends 'base.html' %}{% block content %}<div class="page-heading"><div class="eyebrow">KIỂM SOÁT NGÂN SÁCH</div><h1>{{ title }}</h1><p class="page-subtitle">Nhập dự toán và giá trị thực tế theo chứng từ đã xác nhận.</p></div><form method="post" class="panel standalone-form"><div class="form-grid two-col"><div class="field full"><label>Nội dung khoản chi <em>*</em></label><input required name="name" value="{{ item.name if item else '' }}"></div><div class="field"><label>Nhóm chi phí</label><input name="category" value="{{ item.category if item else 'Chi phí Prelim' }}"></div><div class="field"><label>Đơn vị tính</label><input name="unit" value="{{ item.unit if item else '' }}"></div><div class="field"><label>Khối lượng</label><input type="number" step="0.01" min="0" name="quantity" value="{{ item.quantity if item else 1 }}"></div><div class="field"><label>Đơn giá (VND)</label><input type="number" step="1" min="0" name="unit_price" value="{{ item.unit_price if item else 0 }}"></div><div class="field"><label>Ngân sách dự toán (VND)</label><input type="number" step="1" min="0" name="budget_amount" value="{{ item.budget_amount if item else 0 }}"></div><div class="field"><label>Thực chi (VND)</label><input type="number" step="1" min="0" name="actual_amount" value="{{ item.actual_amount if item else 0 }}"></div><div class="field full"><label>Ghi chú</label><textarea name="notes" rows="3">{{ item.notes if item else '' }}</textarea></div></div><div class="inline-note"><span>ⓘ</span> Tổng dự toán khởi tạo từ bảng Prelim trong Excel. Thực chi chưa được suy diễn từ dự toán.</div><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('costs_list') }}">Hủy</a><button class="btn btn-primary">✓ &nbsp; Lưu khoản chi</button></div></form>{% endblock %}
