{% extends 'base.html' %}{% block content %}<div class="page-heading"><div class="eyebrow">RISK REGISTER</div><h1>{{ title }}</h1><p class="page-subtitle">Xác định mức độ, biện pháp xử lý và người chịu trách nhiệm.</p></div><form method="post" class="panel standalone-form"><div class="form-grid two-col"><div class="field"><label>Nhóm rủi ro</label><input name="category" value="{{ item.category if item else 'Tiến độ' }}"></div><div class="field"><label>Mức độ</label><select name="severity">{% for s in severities %}<option {% if item and item.severity==s %}selected{% elif not item and s=='Trung bình' %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="field full"><label>Mô tả rủi ro / phát hiện <em>*</em></label><textarea name="description" rows="4" required>{{ item.description if item else '' }}</textarea></div><div class="field full"><label>Căn cứ / nguồn phát hiện</label><textarea name="basis" rows="2">{{ item.basis if item else '' }}</textarea></div><div class="field full"><label>Kiến nghị / hành động xử lý</label><textarea name="recommendation" rows="4">{{ item.recommendation if item else '' }}</textarea></div><div class="field"><label>Người phụ trách</label><input name="owner" value="{{ item.owner if item else '' }}" placeholder="Tên người hoặc bộ phận"></div><div class="field"><label>Hạn xử lý</label><input type="date" name="due_date" value="{{ item.due_date if item and item.due_date else '' }}"></div><div class="field"><label>Trạng thái xử lý</label><select name="status">{% for s in risk_statuses %}<option {% if item and item.status==s %}selected{% elif not item and s=='Chưa xử lý' %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div></div><div class="form-actions"><a class="btn btn-outline" href="{{ url_for('risks_list') }}">Hủy</a><button class="btn btn-primary">✓ &nbsp; Lưu rủi ro</button></div></form>{% endblock %}
